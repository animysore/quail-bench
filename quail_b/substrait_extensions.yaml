%YAML 1.2
---
urn: extension:org.fsdatalab.quail_b:functions_ai
scalar_functions:
  - name: ai_filter
    description: Return whether a document satisfies a natural-language prompt.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: document
            value: string
        return: boolean
  - name: ai_join
    description: Return whether two documents satisfy a natural-language prompt.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: left
            value: string
          - name: right
            value: string
        return: boolean
  - name: ai_classify
    description: >-
      Return the label the model scores highest for a document, from a fixed
      list of labels. A label's score is the sum of its tokens' log
      probabilities after the prompt; the earlier label wins a tie.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: document
            value: string
          - name: labels
            value: list<string>
            constant: true
          - name: descriptions
            description: One per label; an empty string means no description.
            value: list<string>
            constant: true
        return: string
  - name: ai_extract
    description: >-
      Extract the requested fields from one document using the exact
      quail_b.rendering.render_extract_prompt instruction. Return a nullable
      struct with response and error fields. A successful response is a
      nullable struct containing one nullable string per requested field,
      in field-list order; error is null. A failure has a null response
      and a nonempty string error. A null document returns a null outer
      struct without inference. The type argument and output_type must
      both match this structure. RelRoot.names supplies nested field
      names in depth-first order.
    impls:
      - args:
          - name: document
            value: string
          - name: fields
            value: list<string>
            constant: true
          - name: result_type
            type: any1
        nullability: DECLARED_OUTPUT
        return: any1?
